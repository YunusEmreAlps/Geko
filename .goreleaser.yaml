version: 2
project_name: geko

builds:
  - main: ./cmd/geko
    binary: geko
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/agents.md
      - docs/architecture.md
      - docs/configuration.md
      - docs/connect.md
      - docs/investigate.md
      - docs/server.md
      - geko.example.yaml

checksum:
  name_template: checksums.txt

release:
  footer: |
    ## Install

    | Platform | Archive |
    | --- | --- |
    | Linux x86-64 | `geko_{{ .Version }}_linux_amd64.tar.gz` |
    | Linux ARM64 | `geko_{{ .Version }}_linux_arm64.tar.gz` |
    | macOS Intel | `geko_{{ .Version }}_darwin_amd64.tar.gz` |
    | macOS Apple silicon | `geko_{{ .Version }}_darwin_arm64.tar.gz` |
    | Windows x86-64 | `geko_{{ .Version }}_windows_amd64.zip` |
    | Windows ARM64 | `geko_{{ .Version }}_windows_arm64.zip` |

    Check an archive with `sha256sum --check --ignore-missing checksums.txt`, or let a script download and check it:

    ```sh
    curl -fsSL https://raw.githubusercontent.com/YunusEmreAlps/geko/master/scripts/install.sh | sh
    ```

    ```powershell
    irm https://raw.githubusercontent.com/YunusEmreAlps/geko/master/scripts/install.ps1 | iex
    ```

    Then run `geko demo` to explore a synthetic dataset, or `geko serve --open` for your own traces.
