# Use a loopback IP and a nonzero TCP port. For non-loopback listeners,
# set GEKO_ACCESS_TOKEN in the environment.
listen_addr: "127.0.0.1:4318"

# Optional separate dashboard and query API listener. Empty shares listen_addr.
# dashboard_addr: "127.0.0.1:8081"

# Optional OTLP/gRPC receiver. Empty disables gRPC; no new port opens by default.
# grpc_addr: "127.0.0.1:4317"

# Uncomment to override the default database in your user configuration directory.
# A relative path is resolved from this file's directory.
# db_path: "data/geko.db"

# Remove traces that have not been received again within this many days.
retention_days: 7

# Limit the main SQLite file. Its WAL and shared-memory files use extra space.
max_db_mib: 256

# Evict the oldest traces at capacity, or set reject to keep existing traces.
on_full: evict_oldest

# best_effort keeps exception messages and stack traces with personal data
# masked; strict stores exception types and message hashes for new spans. The
# default is best_effort, or strict once GEKO_ACCESS_TOKEN is set.
# redaction: best_effort

# Optional link from each trace page to the same trace in another tool, such as
# Grafana Tempo. {trace_id} is replaced with the trace ID.
# trace_link_url: "https://grafana.example.com/explore?left=...{trace_id}..."
# trace_link_name: "Tempo"
